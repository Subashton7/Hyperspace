# Builds the Windows installers and portable zips (x64 + ARM64) on GitHub's machines.
# Runs on every push to main (download them from the run's "Artifacts"), and when you push a tag like v0.11.0
# it also attaches them to a GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - name: Build HyperCore (x64 + ARM64)
        run: node scripts/build-core.js x64 arm64
      - name: Build installers and zips
        run: npx electron-builder --win nsis zip --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: HYPERSPACE-windows
          path: |
            installer/*.exe
            installer/*.zip
            installer/*.yml
            installer/*.blockmap
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/*.exe
            installer/*.zip
            installer/*.yml
            installer/*.blockmap
